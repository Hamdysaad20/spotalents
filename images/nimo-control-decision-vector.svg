<svg width="520" height="400" viewBox="0 0 520 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card drop shadow -->
    <filter id="glassShadow" x="-12" y="-12" width="544" height="424" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.07" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Glass Gradients -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.90" />
    </linearGradient>

    <linearGradient id="activeGrad" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>

    <linearGradient id="successGrad" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#DCFCE7" stop-opacity="0.92" />
    </linearGradient>

    <linearGradient id="blueGlowGrad" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
  </defs>

  <style>
    .ui-font { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
    .item-text { font-size: 12.5px; font-weight: 500; fill: #1E293B; letter-spacing: -0.1px; }
    .item-text-active { font-size: 12.5px; font-weight: 700; fill: #1D4ED8; letter-spacing: -0.1px; }
    .badge-text { font-size: 10px; font-weight: 600; }
    .card-title { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
    .card-sub { font-size: 11px; font-weight: 500; fill: #64748B; }
  </style>

  <!-- ================= LEFT CARD: WORKFLOW CHECKLIST ================= -->
  <g filter="url(#glassShadow)">
    <rect x="12" y="14" width="232" height="372" rx="20" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="1.5" />
    <rect x="12" y="14" width="232" height="372" rx="20" stroke="#E2E8F0" stroke-width="1" stroke-opacity="0.6" />
  </g>

  <!-- Vertical connecting timeline guide -->
  <line x1="37" y1="52" x2="37" y2="348" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Item 1: Review AST code telemetry (Completed) -->
  <g transform="translate(26, 40)">
    <circle cx="11" cy="11" r="10" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.5" />
    <path d="M7.5 11L9.8 13.5L14.5 8.5" stroke="#15803D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <text x="32" y="15" class="ui-font item-text">Review AST code telemetry</text>
  </g>

  <!-- Dotted Divider 1 -->
  <line x1="32" y1="92" x2="228" y2="92" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Item 2: Inspect candidate benchmarks (Completed) -->
  <g transform="translate(26, 102)">
    <circle cx="11" cy="11" r="10" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.5" />
    <path d="M7.5 11L9.8 13.5L14.5 8.5" stroke="#15803D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <text x="32" y="15" class="ui-font item-text">Inspect candidate benchmarks</text>
  </g>

  <!-- Dotted Divider 2 -->
  <line x1="32" y1="154" x2="228" y2="154" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Item 3: Seat-by-seat sign-off (Active / Current Stage) -->
  <g transform="translate(26, 164)">
    <!-- Active background pill -->
    <rect x="-6" y="-6" width="208" height="34" rx="10" fill="url(#activeGrad)" stroke="#BFDBFE" stroke-width="1" />
    <circle cx="11" cy="11" r="10" fill="#2563EB" />
    <circle cx="11" cy="11" r="4" fill="#FFFFFF" />
    <circle cx="11" cy="11" r="14" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="0.35" fill="none" />
    <text x="32" y="15" class="ui-font item-text-active">Seat-by-seat sign-off</text>
  </g>

  <!-- Dotted Divider 3 -->
  <line x1="32" y1="216" x2="228" y2="216" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Item 4: Set sprint milestone gates (Pending) -->
  <g transform="translate(26, 226)">
    <circle cx="11" cy="11" r="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <circle cx="11" cy="11" r="3.5" fill="#94A3B8" />
    <text x="32" y="15" class="ui-font item-text" fill="#64748B">Set sprint milestone gates</text>
  </g>

  <!-- Dotted Divider 4 -->
  <line x1="32" y1="278" x2="228" y2="278" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Item 5: Pause or scale anytime (Pending) -->
  <g transform="translate(26, 288)">
    <circle cx="11" cy="11" r="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <circle cx="11" cy="11" r="3.5" fill="#94A3B8" />
    <text x="32" y="15" class="ui-font item-text" fill="#64748B">Pause or scale squad anytime</text>
  </g>

  <!-- Dotted Divider 5 -->
  <line x1="32" y1="340" x2="228" y2="340" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Item 6: Confirm 48h pod sync (Pending) -->
  <g transform="translate(26, 350)">
    <circle cx="11" cy="11" r="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <circle cx="11" cy="11" r="3.5" fill="#94A3B8" />
    <text x="32" y="15" class="ui-font item-text" fill="#64748B">Confirm 48h pod sync</text>
  </g>


  <!-- ================= RIGHT SIDE: INTERACTIVE DECISION FLOW ================= -->

  <!-- Horizontal connector line from Step 3 to Right Top Card -->
  <path d="M 234 175 C 248 175, 252 85, 272 85" fill="none" stroke="#3B82F6" stroke-width="1.8" stroke-dasharray="3 3" />
  <circle cx="272" cy="85" r="3.5" fill="#2563EB" />

  <!-- RIGHT CARD 1: Proposed Candidate for Approval -->
  <g transform="translate(268, 32)" filter="url(#glassShadow)">
    <rect width="240" height="106" rx="16" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="1.5" />
    <rect width="240" height="106" rx="16" stroke="#93C5FD" stroke-width="1.2" stroke-opacity="0.8" />

    <!-- Role Icon & Avatar Badge -->
    <rect x="14" y="16" width="34" height="34" rx="10" fill="url(#blueGlowGrad)" />
    <!-- User/Engineer Code Icon -->
    <path d="M26 31C26 28.5 28 26.5 31 26.5C34 26.5 36 28.5 36 31" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="31" cy="22.5" r="3.5" stroke="#FFFFFF" stroke-width="1.5" fill="none" />

    <!-- Role Title -->
    <text x="56" y="27" class="ui-font card-title">Senior Backend Pod Lead</text>
    <text x="56" y="42" class="ui-font card-sub">Go • Distributed Systems • EKS</text>

    <!-- Telemetry Tag & Status -->
    <rect x="14" y="64" width="82" height="24" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
    <circle cx="24" cy="76" r="3" fill="#22C55E" />
    <text x="32" y="79.5" class="ui-font badge-text" fill="#15803D">AST 94.8 Score</text>

    <rect x="102" y="64" width="124" height="24" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <text x="164" y="79.5" class="ui-font badge-text" fill="#1D4ED8" text-anchor="middle">Awaiting Your Sign-Off</text>
  </g>

  <!-- Vertical connector line from Card 1 to Card 2 with animated indicator -->
  <g transform="translate(388, 142)">
    <line x1="0" y1="0" x2="0" y2="80" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 4" />
    <!-- Pulsing active blue node -->
    <circle cx="0" cy="0" r="4.5" fill="#2563EB" />
    <circle cx="0" cy="0" r="8" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.4" fill="none" />
    
    <!-- Directional Arrow down to approval card -->
    <polygon points="-5,78 5,78 0,86" fill="#16A34A" />
  </g>

  <!-- RIGHT CARD 2: Approved by You (Outcome State) -->
  <g transform="translate(268, 234)" filter="url(#glassShadow)">
    <rect width="240" height="114" rx="16" fill="url(#successGrad)" stroke="#FFFFFF" stroke-width="1.5" />
    <rect width="240" height="114" rx="16" stroke="#86EFAC" stroke-width="1.5" stroke-opacity="0.9" />

    <!-- Soft Green Checkmark Icon Badge -->
    <rect x="16" y="16" width="36" height="36" rx="12" fill="#22C55E" />
    <path d="M26 34L31 39L42 28" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Approved Status Title -->
    <text x="60" y="29" class="ui-font card-title" fill="#14532D">Approved by you.</text>
    <text x="60" y="44" class="ui-font card-title" fill="#15803D" font-size="12.5">Pod deployment confirmed</text>

    <!-- Sub-info -->
    <rect x="16" y="68" width="208" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.85" stroke="#BBF7D0" stroke-width="1" />
    <circle cx="28" cy="83" r="3.5" fill="#16A34A" />
    <text x="38" y="86.5" class="ui-font card-sub" fill="#166534" font-weight="600">48-Hour Sprint Integration Active</text>
  </g>

</svg>