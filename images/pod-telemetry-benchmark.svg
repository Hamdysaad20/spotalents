<svg width="355" height="427" viewBox="0 0 355 427" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="355" y2="427" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1526" />
      <stop offset="50%" stop-color="#090D18" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="355" y2="427" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cardSubBg" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#151D2F" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F1726" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="meterGrad" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10" y="-10" width="375" height="447" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#00D2FF" flood-opacity="0.12" />
    </filter>
  </defs>

  <style>
    .mono { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
    .label { font-size: 10px; font-weight: 600; fill: #94A3B8; letter-spacing: 0.8px; text-transform: uppercase; }
    .val-large { font-size: 32px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.5px; }
    .val-med { font-size: 19px; font-weight: 700; fill: #F8FAFC; }
    .subtext { font-size: 10.5px; fill: #64748B; font-weight: 500; }
  </style>

  <!-- Main Card Container -->
  <g filter="url(#cardShadow)">
    <rect x="1" y="1" width="353" height="425" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  </g>

  <!-- Ambient Glow Behind Header -->
  <circle cx="280" cy="40" r="60" fill="#00D2FF" fill-opacity="0.08" filter="url(#glowCyan)" />

  <!-- ================= HEADER SECTION ================= -->
  <g transform="translate(20, 22)">
    <!-- Live Pulse Dot -->
    <circle cx="6" cy="6" r="4" fill="#10B981" />
    <circle cx="6" cy="6" r="7" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.4" fill="none" />
    <text x="20" y="10" class="mono label" fill="#10B981">LIVE POD TELEMETRY</text>

    <!-- Verified Badge -->
    <rect x="220" y="-2" width="95" height="20" rx="10" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
    <text x="267" y="12" class="mono" font-size="9" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="0.5">TIER-1 POD</text>
  </g>

  <!-- ================= HERO METRIC: AST COMPLEXITY ================= -->
  <g transform="translate(20, 58)">
    <rect width="315" height="112" rx="14" fill="url(#cardSubBg)" stroke="#1E293B" stroke-width="1" />
    
    <!-- Header inside metric card -->
    <text x="16" y="24" class="mono label">AST CODE COMPLEXITY BENCHMARK</text>
    <rect x="248" y="12" width="53" height="18" rx="9" fill="#00D2FF" fill-opacity="0.12" stroke="#00D2FF" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="274" y="24" class="mono" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle">TOP 2%</text>

    <!-- Score Display -->
    <text x="16" y="62" class="mono val-large">94.8</text>
    <text x="96" y="62" class="mono" font-size="16" font-weight="600" fill="#64748B">/ 100</text>
    
    <!-- Audit tag -->
    <text x="16" y="80" class="mono subtext">Crucible Architecture &amp; Logic Audited</text>

    <!-- Progress Track -->
    <rect x="16" y="93" width="283" height="6" rx="3" fill="#1E293B" />
    <rect x="16" y="93" width="268" height="6" rx="3" fill="url(#meterGrad)" />
  </g>

  <!-- ================= TWO COLUMN METRICS ================= -->
  <g transform="translate(20, 182)">
    <!-- Left Box: PR Merge Velocity -->
    <g>
      <rect width="152" height="96" rx="14" fill="url(#cardSubBg)" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="24" class="mono label">PR VELOCITY</text>
      <text x="14" y="58" class="mono val-med">&lt; 2.4 hrs</text>
      <text x="14" y="78" class="mono subtext">Avg. Async Merge</text>
      
      <!-- Mini trend indicator -->
      <circle cx="132" cy="20" r="3" fill="#10B981" />
    </g>

    <!-- Right Box: AI Workflow Acceleration -->
    <g transform="translate(163, 0)">
      <rect width="152" height="96" rx="14" fill="url(#cardSubBg)" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="24" class="mono label">AI VELOCITY</text>
      <text x="14" y="58" class="mono val-med">10x Output</text>
      <text x="14" y="78" class="mono subtext">Cursor / Claude / RAG</text>

      <!-- Mini spark indicator -->
      <circle cx="132" cy="20" r="3" fill="#38BDF8" />
    </g>
  </g>

  <!-- ================= DEPLOYMENT SPEED BANNER ================= -->
  <g transform="translate(20, 290)">
    <rect width="315" height="52" rx="12" fill="url(#cardSubBg)" stroke="#1E293B" stroke-width="1" />
    
    <!-- Lightning bolt icon -->
    <rect x="12" y="13" width="26" height="26" rx="8" fill="#3B82F6" fill-opacity="0.15" />
    <path d="M25 18L21 26H25L24 33L29 25H25L26 18Z" fill="#38BDF8" />

    <text x="48" y="28" class="mono" font-size="12" font-weight="700" fill="#F8FAFC">48-Hour Production Sync</text>
    <text x="48" y="43" class="mono subtext">Zero Ramp-Up • Day-1 Repo Integration</text>
  </g>

  <!-- ================= FOOTER: EEA RECOGNITION ================= -->
  <g transform="translate(20, 354)">
    <rect width="315" height="52" rx="12" fill="#0A101D" stroke="#1E293B" stroke-width="1" />
    
    <!-- Trophy / Award Icon -->
    <rect x="12" y="13" width="26" height="26" rx="8" fill="#F59E0B" fill-opacity="0.12" />
    <path d="M22 19H28V23C28 24.6569 26.6569 26 25 26C23.3431 26 22 24.6569 22 23V19Z" stroke="#F59E0B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M20 20H22V22H20V20Z" stroke="#F59E0B" stroke-width="1.3" />
    <path d="M28 20H30V22H28V20Z" stroke="#F59E0B" stroke-width="1.3" />
    <path d="M25 26V29M23 29H27" stroke="#F59E0B" stroke-width="1.3" stroke-linecap="round" />

    <text x="48" y="28" class="mono" font-size="11" font-weight="700" fill="#FDE68A">EEA 2025 Winner</text>
    <text x="48" y="43" class="mono subtext">People of Tomorrow • Workforce Innovation</text>
  </g>
</svg>